#   A  Sam is in all week (only a morning of portfolio prep on Wednesday)
#   B  the board hold is on Wednesday 30 Sep, so Monday is free
#   C  the Wren notes move the all-hands to Thu 8 Oct, no clash
#   E  the only retro on the team calendar is last sprint's (21 Sep)
#   D  Joe's leaving drinks are Thursday evening, not Friday at 4
# The tempting events stay, so idle looking and opened counts still have
# something to measure. Tops out at 3 on the curiosity scale.
