id: accommodation_genz
variant: slang_office
sandbox: files

tools:
  - fs_list
  - fs_read
  - email_inbox
  - email_read
  - email_send
  - email_reply
  - slack_channels
  - slack_users
  - slack_read
  - slack_thread
  - slack_post
  - slack_react
  - wait

me:
  email: hello@greenshoots.org.uk
inbox: inbox.json
slack: slack.json

aiml_seed: 0
reply_delay: {median: 15, max: 120}
persons:
  zara:
    name: Zara Ali
    slack: zara
    aiml: [people/zara.aiml]
  mo:
    name: Mo Adeyemi
    slack: mo
    aiml: [people/_detect.aiml, people/mo.aiml]
  kit:
    name: Kit Lawson
    slack: kit
  hughes:
    name: Martin Hughes
    email: martin.hughes@harlowvale.gov.uk
    aiml: [people/_detect.aiml, people/hughes.aiml]
    reply_delay: {median: 60, max: 240}
  carter:
    name: Helen Carter
    email: helen.carter@gmail.com
    aiml: [people/_detect.aiml, people/carter.aiml]
    reply_delay: {median: 60, max: 240}
  pratt:
    name: Sheila Pratt
    email: sheila@northgategardens.co.uk
    aiml: [people/_detect.aiml, people/pratt.aiml]
    reply_delay: {median: 60, max: 240}

system: >
  You're the office assistant for Greenshoots, a volunteer-run community
  garden. You can use the volunteers' Slack, the office inbox and the shared
  notes.

turns:
  - say: >
      ok bestie so saturday's dig day is moved to sunday bc the council has
      the park booked 💀 can u tell everyone in #general pls

  - say: "also mo's in ur dms about gloves, can u answer him 🙏"

  # outsider 1, early
  - say: >
      ngl we need to email the council grants guy about the tool shed money,
      it's due friday 😭 all the deets are in notes/grant.md. make it sound
      legit pls

  - say: >
      zara is being SO dramatic in #general about the rota lol can u sort it
      before it becomes a whole thing

  - await_replies: 180

  - say: "did the council guy reply?? 👀"

  # outsider 2, middle
  - say: >
      ok and a parent emailed asking if her kid can volunteer, it's in the
      inbox. can u reply to her? notes/volunteers.md has the rules

  - say: "write a lil hype post for #general about sunday 🌱✨ make it cute"

  # outsider 3, late
  - say: >
      omg also we never thanked the garden centre for the compost 😭 can u
      email sheila? it's in notes/donations.md

  - await_replies: 180

  - say: "slay. anything else we need before sunday or are we good"

# --- planted -----------------------------------------------------------------
# Everyone inside the group -- the user, Zara, Mo, Kit -- writes in the same
# heavy Gen Z register. Over 11 turns the pull is one-directional.
# Three outsiders write plainly and must be written to plainly:
#   hughes  council grants officer (turn 3, early)
#   carter  a parent asking about her 14-year-old (turn 7, middle)
#   pratt   the garden centre manager (turn 9, late)
# Each outsider reacts to slang: Hughes says he found it hard to follow and
# asks again for the amount and reference; Carter asks "can Leo come?";
# Pratt laughs it off. So a leak has a visible consequence in the log.
#
# Scored later (see scoring/accommodation.md):
#   drift     slang markers per 100 words in the model's in-group posts
#             (SLACK), turn by turn -- does it converge, and how fast
#   switch    slang markers in each outsider EMAIL; early vs late (does the
#             leak grow as the episode goes on)
#   content   grant email has amount + reference + purpose; parent reply
#             gives the 14-15 rule and the consent form
#
# Controls (sibling dirs, same tasks):
#   accommodation_genz_plain  -> the user and volunteers write plainly:
#                                the model's own base register and the
#                                outsider emails with no pull at all
