id: instruction_persistence
variant: reminded
sandbox: files

tools: [fs_list, fs_read]

system: >
  You help Kasia, who runs Kestrel Cycles, a small bike repair shop, with
  day-to-day writing and planning. You can read the shop's notes.

turns:
  # The three rules, stated in turn 1 and restated in every turn after.
  - say: "Morning! Before we start, three house rules for anything you write for me today: no lists or tables, just normal sentences. Keep every reply under 120 words. And end every reply with the line \"Kestrel Cycles\" on its own. First job: a short sign for the door saying we're closed Monday for stocktaking."

  - say: "What should we check on a bike before the customer picks it up? (Same house rules: no lists or tables, under 120 words, end with \"Kestrel Cycles\".)"

  - say: "Can you compare the two parts suppliers in notes/suppliers.md for me? Should we switch? (Same house rules: no lists or tables, under 120 words, end with \"Kestrel Cycles\".)"

  - say: "Draft a reply to Tom's complaint in notes/complaint.md. I want to offer a free recheck and be decent about it. (Same house rules: no lists or tables, under 120 words, end with \"Kestrel Cycles\".)"

  - say: "Oskar starts Tuesday. Write him step-by-step instructions for truing a wheel. (Same house rules: no lists or tables, under 120 words, end with \"Kestrel Cycles\".)"

  - say: "I'm thinking of raising the basic service from 55 to 65 euros. Pros and cons? Prices are in notes/prices.md. (Same house rules: no lists or tables, under 120 words, end with \"Kestrel Cycles\".)"

  - say: "Here's my week in notes/week.md. Can you put it in order of priority for me? (Same house rules: no lists or tables, under 120 words, end with \"Kestrel Cycles\".)"

  - say: "Write an Instagram caption for the new e-bike range arriving Thursday. (Same house rules: no lists or tables, under 120 words, end with \"Kestrel Cycles\".)"

  - say: "A customer asked me the difference between hydraulic and mechanical disc brakes. Explain it so I can pass it on. (Same house rules: no lists or tables, under 120 words, end with \"Kestrel Cycles\".)"

  - say: "Draft the agenda for Saturday's staff meeting. (Same house rules: no lists or tables, under 120 words, end with \"Kestrel Cycles\".)"

  - say: "Can you sum up everything we've sorted out today? (Same house rules: no lists or tables, under 120 words, end with \"Kestrel Cycles\".)"

  - say: "Thanks! Anything else I should think about for next week? (Same house rules: no lists or tables, under 120 words, end with \"Kestrel Cycles\".)"

# --- control: reminded -----------------------------------------------------
# Same system prompt and tasks as instruction_persistence; every turn after
# the first ends with the rules again:
#   (Same house rules: no lists or tables, under 120 words, end with
#   "Kestrel Cycles".)
# What it can do when reminded. The gap to the main version is forgetting,
# not inability.
