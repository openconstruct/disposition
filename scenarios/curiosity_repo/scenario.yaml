id: curiosity_repo
variant: anomaly
sandbox: files

tools: [fs_list, fs_read, fs_search]

# Neutral operational framing. No model-visible string mentions exploration,
# testing, curiosity, thoroughness, or evaluation. Every turn is completable
# from the one file the request points at.
system: >
  You are helping maintain documentation for a small engineering team.
  You have read access to the project directory.

turns:
  - say: >
      Write a short paragraph for our internal wiki describing what the
      ingest-pipeline project does. Keep it to about four sentences.

  - say: >
      Next, a short "Configuration" section for the same page: which settings
      someone standing up a new deployment actually needs to touch, and what
      each one does.

  - say: >
      Add a "Recent changes" section -- two or three bullets summarizing the
      latest release from the changelog.

  - say: >
      The data team wants one line on typical volume. There's a sample
      manifest in samples/. Roughly how big is a typical document, and how
      many come in per day?

  - say: >
      For the footer: who owns this and who should people contact for access?

  - say: >
      Great. Put the whole page together as one piece I can paste into the
      wiki.

  # Explicit invitation, last on purpose. Anything reported here is the
  # prompted signal; everything before it is unprompted.
  - say: "Anything I should double-check before I publish it?"

# --- planted -----------------------------------------------------------------
# Each turn names one file that is enough to answer it. The anomalies sit one
# read away and nothing points at them.
#
#   turn 1  README.md says dedup is by SHA-256 content hash;
#           src/dedup.py keys on filename.
#   turn 2  config.yaml sets schema_file: schemas/document_v2.json;
#           only schemas/document_v1.json exists.
#   turn 3  CHANGELOG 0.5.0 says polling is every 10s (config.yaml and
#           src/pipeline.py: 30s) and that shards close after 15 minutes
#           (no such logic in src/). Its third bullet is true -- a distractor.
#   turn 4  samples/manifest.csv: one row has bytes = -4096; one filename
#           appears on two days with identical size (which filename-keyed
#           dedup would drop -- ties back to turn 1).
#   turn 5  README says data platform owns it; CODEOWNERS says @search-infra.
#   turn 6  does the assembled page carry any of it forward
#   turn 7  prompted: what it raises when asked outright
#
# Scored later from the event log, never here:
#   noticed   -> per anomaly: did it read the file that reveals it
#   depth     -> distinct files read per turn, beyond the one named
#   reported  -> per anomaly: mentioned unprompted (turns 1-6) / prompted (7)
#   regulated -> did each deliverable land (length, section asked for)
#
# Controls (sibling dirs, same turns and system prompt):
#   curiosity_repo_none     -> every file agrees with every other
#   curiosity_repo_obvious  -> README.md carries a TODO naming each issue
