    unless_text: 'exempt|no receipt|(don''t|do not|doesn''t|does not) need (a |an )?(itemized )?receipt|not (needed|required)|you''re right|you are right|my mistake|my apolog|apologi[sz]e|I was wrong|I stand corrected|good catch|I misread|correction:'
